<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock and sales tracker | Demo by InfiniTechnologies</title>
<style>
:root{--navy:#0A1A33;--blue:#0B6FA4;--orange:#FF7A1A;--ink:#0E1B2E;--muted:#4E617A;--line:#DCE5EE;--surface:#F4F7FB;--red:#B42318;--green:#0F6B3F;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--surface);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.demo{background:var(--navy);color:#fff;font-size:14px;padding:10px 20px;display:flex;flex-wrap:wrap;gap:2px 16px;justify-content:space-between}
.demo a{color:#7FD3F5;font-weight:600}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px 40px}
header{padding:26px 0 14px}
h1{margin:0;font-size:clamp(1.7rem,5vw,2.3rem);line-height:1.1;letter-spacing:-.02em}
header p{margin:6px 0 0;color:var(--muted)}
.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
@media(min-width:720px){.sum{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sum div{background:#fff;padding:14px 16px}
.sum b{display:block;font-size:1.55rem;line-height:1.2}
.sum span{color:var(--muted);font-size:14px}
.alert{margin:16px 0 0;background:#FFF4E8;border:1px solid #F5C99B;border-radius:14px;padding:14px 16px}
.alert strong{display:block;margin-bottom:6px}
.alert ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.alert button{min-height:44px;padding:0 14px;border:1px solid #E8A669;border-radius:999px;background:#fff;cursor:pointer;color:var(--ink)}
.cols{display:grid;gap:16px;margin-top:16px}
@media(min-width:860px){.cols{grid-template-columns:minmax(0,340px) minmax(0,1fr);align-items:start}}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
.box h2{margin:0 0 12px;font-size:1.15rem}
.lb{display:block;margin:12px 0 4px;font-weight:600;font-size:15px}
select,input{width:100%;min-height:48px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{min-height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-weight:600}
.seg button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.go{margin-top:16px;width:100%;min-height:48px;border:0;border-radius:10px;background:var(--orange);color:var(--navy);font-weight:700;cursor:pointer}
.msg{margin:10px 0 0;font-weight:600;font-size:15px;min-height:1.5em}
.msg.e{color:var(--red)}.msg.ok{color:var(--green)}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item strong{display:block}
.meta{color:var(--muted);font-size:14px}
.meter{grid-column:1/-1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue)}
.low .meter i{background:var(--orange)}.out .meter i{background:var(--red)}
.tag{font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;background:#E3F4EA;color:var(--green)}
.low .tag{background:#FFE9D2;color:#8A4300}.out .tag{background:#FDE4E1;color:var(--red)}
.pick{min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}
.right{display:flex;align-items:center;gap:10px}
#log{list-style:none;margin:0;padding:0}
#log li{display:flex;gap:14px;padding:10px 0;border-top:1px solid var(--line)}
#log li:first-child{border-top:0}
#log time{color:var(--muted);flex:none;width:48px}
.foot{margin-top:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;color:var(--muted);font-size:14px}
.foot button{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;color:var(--ink)}
</style>
</head>
<body>
<div class="demo"><span>Demo project by InfiniTechnologies. Sample stock and sales, not a real business.</span><a href="/#work">Back to InfiniTechnologies</a></div>
<main class="wrap">
  <header>
    <h1>Duka la Mtaa stock</h1>
    <p id="today"></p>
  </header>

  <section class="sum" id="sum" aria-label="Today’s summary"></section>
  <section id="alert" aria-live="polite"></section>

  <div class="cols">
    <section class="box" aria-labelledby="rh">
      <h2 id="rh">Record a sale or stock in</h2>
      <div class="seg" role="group" aria-label="What happened?">
        <button type="button" data-type="out" aria-pressed="true">Sale</button>
        <button type="button" data-type="in" aria-pressed="false">Stock in</button>
      </div>
      <label class="lb" for="item">Item</label>
      <select id="item"></select>
      <label class="lb" for="qty">Quantity</label>
      <input id="qty" type="number" inputmode="numeric" min="1" step="1" value="1">
      <button class="go" id="go" type="button">Record sale</button>
      <p class="msg" id="msg" role="status"></p>
    </section>

    <section class="box" aria-labelledby="sh">
      <h2 id="sh">Stock on hand</h2>
      <div id="list"></div>
    </section>
  </div>

  <section class="box" style="margin-top:16px" aria-labelledby="lh">
    <h2 id="lh">Today’s activity</h2>
    <ul id="log"></ul>
  </section>

  <div class="foot">
    <span>Records stay on this device in this demo. A real build keeps them in a database your whole team can use.</span>
    <button type="button" id="reset">Reset sample data</button>
  </div>
</main>

<script>
const KEY="infini-stock-demo-v1";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const kes=n=>"KES "+n.toLocaleString("en-KE");
const at=(h,m)=>{const d=new Date();d.setHours(h,m,0,0);return d.getTime()};

function seed(){
  const items=[
    {id:1,n:"Maize flour 2 kg",price:190,stock:24,min:10},
    {id:2,n:"Rice 2 kg",price:330,stock:9,min:10},
    {id:3,n:"Sugar 2 kg",price:290,stock:4,min:10},
    {id:4,n:"Cooking oil 1 litre",price:340,stock:18,min:8},
    {id:5,n:"Tea leaves 250 g",price:120,stock:30,min:10},
    {id:6,n:"Bar soap 800 g",price:210,stock:0,min:6},
    {id:7,n:"Fresh milk 500 ml",price:65,stock:36,min:20},
    {id:8,n:"Toilet paper 4 rolls",price:140,stock:14,min:6}
  ];
  const log=[
    {t:at(8,12),type:"out",id:1,q:3,price:190},
    {t:at(8,47),type:"out",id:7,q:6,price:65},
    {t:at(9,20),type:"out",id:3,q:2,price:290},
    {t:at(10,5),type:"out",id:6,q:4,price:210},
    {t:at(10,40),type:"in",id:5,q:12,price:120},
    {t:at(11,15),type:"out",id:2,q:1,price:330}
  ];
  return {items,log};
}
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load(),type="out";
const by=id=>S.items.find(i=>i.id===+id);
const status=i=>i.stock<=0?"out":i.stock<=i.min?"low":"ok";
const label={ok:"In stock",low:"Low",out:"Out of stock"};
const isToday=t=>new Date(t).toDateString()===new Date().toDateString();
const hm=t=>new Date(t).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});

function render(){
  $("#today").textContent=new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  const td=S.log.filter(l=>isToday(l.t)),sales=td.filter(l=>l.type==="out");
  const need=S.items.filter(i=>status(i)!=="ok");
  $("#sum").innerHTML=[
    [kes(sales.reduce((s,l)=>s+l.q*l.price,0)),"Sales today"],
    [sales.reduce((s,l)=>s+l.q,0),"Units sold"],
    [sales.length,"Sales recorded"],
    [need.length,"Items to reorder"]
  ].map(([v,l])=>`<div><b>${v}</b><span>${l}</span></div>`).join("");

  $("#alert").innerHTML=need.length?`<div class="alert"><strong>${need.length} item${need.length>1?"s":""} need${need.length>1?"":"s"} reordering. Choose one to record new stock.</strong><ul>${need.map(i=>`<li><button type="button" data-restock="${i.id}">${esc(i.n)}: ${i.stock} left, reorder at ${i.min}</button></li>`).join("")}</ul></div>`:"";

  const sel=$("#item"),cur=sel.value;
  sel.innerHTML=S.items.map(i=>`<option value="${i.id}">${esc(i.n)} (${i.stock} in stock)</option>`).join("");
  if(cur)sel.value=cur;

  $("#list").innerHTML=S.items.map(i=>{const s=status(i),w=Math.min(100,Math.round(i.stock/(i.min*3)*100));
    return `<div class="item ${s}"><div><strong>${esc(i.n)}</strong><span class="meta">${i.stock} in stock, reorder at ${i.min}, ${kes(i.price)} each</span></div><div class="right"><span class="tag">${label[s]}</span><button class="pick" type="button" data-pick="${i.id}">Select</button></div><div class="meter" aria-hidden="true"><i style="width:${w}%"></i></div></div>`}).join("");

  $("#log").innerHTML=td.length?[...td].sort((a,b)=>b.t-a.t).map(l=>{const i=by(l.id);
    return `<li><time>${hm(l.t)}</time><span>${l.type==="out"?`Sold ${l.q} × ${esc(i.n)}, ${kes(l.q*l.price)}`:`Received ${l.q} × ${esc(i.n)}`}</span></li>`}).join("")
    :`<li>No movements yet today. Record a sale to see it appear here.</li>`;

  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.type===type));
  $("#go").textContent=type==="out"?"Record sale":"Record stock in";
}
function say(t,ok){const m=$("#msg");m.textContent=t;m.className="msg "+(ok?"ok":"e")}
function record(){
  const i=by($("#item").value),q=Number($("#qty").value);
  if(!Number.isInteger(q)||q<1){say("Enter a whole number of 1 or more.");return}
  if(type==="out"&&q>i.stock){say(i.stock?`Only ${i.stock} of ${i.n} left. Enter ${i.stock} or less.`:`${i.n} is out of stock. Record new stock first.`);return}
  i.stock+=type==="in"?q:-q;
  S.log.push({t:Date.now(),type,id:i.id,q,price:i.price});
  save();render();
  say(type==="out"?`Sale recorded: ${q} × ${i.n}.`:`Stock recorded: ${q} × ${i.n}.`,true);
  $("#qty").value=1;
  const w=status(i);if(type==="out"&&w!=="ok")say(`Sale recorded. ${i.n} is now ${w==="out"?"out of stock":"low ("+i.stock+" left)"}.`,true);
}

document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  const d=t.dataset;
  if(d.type){type=d.type;render();say("",true)}
  else if(d.pick){$("#item").value=d.pick;$("#qty").focus()}
  else if(d.restock){type="in";render();$("#item").value=d.restock;$("#qty").focus();$("#qty").select()}
  else if(t.id==="go")record();
  else if(t.id==="reset"){S=seed();type="out";save();render();say("Sample data restored.",true)}
});
$("#qty").addEventListener("keydown",e=>{if(e.key==="Enter")record()});
render();
</script>
</body>
</html>
